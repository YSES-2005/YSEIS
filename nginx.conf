events {
    worker_connections 1024;
}

http {
    # 1. Optimizations
    sendfile on;
    keepalive_timeout 65;
    
    # 2. Define Upstreams (The internal docker service names)
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:5000;
    }

    upstream mongo_express_upstream {
        server mongo-express:8081;
    }

    server {
        listen 80;
        server_name _;

        # --- ROUTE 1: API Requests ---
        # Any request starting with /api/ goes to the Backend
        location /api/ {
            
            proxy_pass http://backend_upstream;
            
            # Standard Proxy Headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mongo-express/ {
            proxy_pass http://mongo_express_upstream/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- ROUTE 2: Frontend ---
        # Everything else goes to the Frontend
        location / {
            proxy_pass http://frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

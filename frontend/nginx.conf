user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimization for static file serving
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # SERVER BLOCK: The Frontend (www.hatagi.org)
    server {
        listen 80;
        
        # In Dokploy, this container handles traffic for the domain you linked.
        # We use a wildcard/default to catch requests sent to this container.
        server_name _; 

        # 1. Serve the Static Files (Built by Vite/Nuxt/etc)
        root /usr/share/nginx/html;
        index index.html;

        # 2. Handle SPA Routing (Crucial for Vue/React)
        # If the file doesn't exist (e.g., /dashboard), serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 3. Optional: Proxy API calls to Backend (to avoid CORS)
        # If you call /api/v1/..., it forwards to the backend container
        location /api/ {
            # "backend" matches the service name in docker-compose
            proxy_pass http://backend:5000/api; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}

name: CI Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Bootstrap Shared Workspace Directory
        run: mkdir -p shared/dist

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prettier Code Formatting
        run: pnpm run format:check

      - name: Build Shared Schemas
        run: pnpm run build:shared

      - name: Execute ESLint Across Workspaces
        run: pnpm run lint

  typecheck:
    name: TypeScript Compilation & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Bootstrap Shared Workspace Directory
        run: mkdir -p shared/dist

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build Workspaces
        run: pnpm run build

  test-shared:
    name: Test Suite - Shared (>=80% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Bootstrap Shared Workspace Directory
        run: mkdir -p shared/dist

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Shared Tests with Coverage Enforcement
        run: pnpm --filter ./shared run test:coverage

  test-backend:
    name: Test Suite - Backend API (>=80% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Bootstrap Shared Workspace Directory
        run: mkdir -p shared/dist

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Dependency
        run: pnpm run build:shared

      - name: Run Backend Tests with Coverage Enforcement
        run: pnpm --filter ./backend run test:coverage

  test-frontend:
    name: Test Suite - Frontend App (>=80% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Bootstrap Shared Workspace Directory
        run: mkdir -p shared/dist

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Dependency
        run: pnpm run build:shared

      - name: Run Frontend Tests with Coverage Enforcement
        run: pnpm --filter ./frontend run test:coverage

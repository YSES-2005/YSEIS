services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      PORT: 5000
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: ${API_URL}
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  mongo-data:

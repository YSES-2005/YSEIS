services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["pnpm", "run", "dev"]
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/inventory
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app:z,cached
      - backend_node_modules:/usr/src/app/node_modules
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["pnpm", "run", "dev"]
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app:z,cached
      - frontend_node_modules:/usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  backend_node_modules:
  frontend_node_modules:
